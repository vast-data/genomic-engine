# !!! TEMPLATE - Do NOT edit. Copy to genomics-ingest.yaml and fill in values !!!
#
# Genomics Ingest Secret
# All three ingest functions (genomics-fastq-registrar, genomics-vcf-parser,
# genomics-variant-processor) consume keys from this single secret.
#
# Usage:
#   cp deployments/dataengine-genomics-pipeline/genomics-ingest-template.yaml deployments/dataengine-genomics-pipeline/genomics-ingest.yaml
#   # Edit genomics-ingest.yaml with your actual credentials
#   # Upload in DataEngine UI → Secrets → Create → name: genomicsecret

genomicsecret:
  # VAST credentials (shared across all functions)
  vast_access_key: ""
  vast_secret_key: ""

  # S3 endpoint (used by genomics-fastq-registrar, genomics-vcf-parser)
  s3endpoint: "http://"

  # VastDB query engine (used by genomics-fastq-registrar, genomics-variant-processor)
  vdbendpoint: "http://"
  vdbbucket: "genomics-data"
  vdbschema: "genomics"

  # Backend Integration (used by genomics-fastq-registrar)
  # Pick ONE depending on where the DataEngine functions actually run:
  #   - DataEngine on the same cluster as the application:
  #       backend_url: "http://backend.genomics.svc.cluster.local:8000"
  #   - DataEngine on a separate cluster (typical):
  #       backend_url: "https://<your-app-hostname>"   (Gateway / Ingress URL)
  # The function appends /api/v1/pipelines/submit, so the value above must NOT
  # end with a trailing slash and must NOT include the /api prefix.
  backend_url: "http://backend.genomics.svc.cluster.local:8000"
  jwt_secret: ""

  # Processing mode: "mock" for CPU-only mock, "gpu" for real Parabricks
  processing_mode: "mock"

  # NVIDIA NIM (used by genomics-vcf-parser, genomics-variant-processor)
  # Cloud (default): set use_api_catalog: true + nvidia_api_key → ignores host/port/scheme fields.
  # Local NIM:       set use_api_catalog: false + configure host/port/scheme for each service.
  use_api_catalog: false
  nvidia_api_key: ""

  # LLM -- used by genomics-vcf-parser for clinical summaries
  # Empirically nvidia/llama-3.1-nemotron-nano-8b-v1 is ~7x faster than meta/llama-3.1-8b-instruct
  # on the NVIDIA cloud API (~4s vs ~26s for 300-token outputs).
  llm_model: "nvidia/llama-3.1-nemotron-nano-8b-v1"
  llmhost: ""
  llmport: "8000"
  llmhttpscheme: "http"

  # Embedding -- used by genomics-variant-processor for variant vectors
  embeddingmodel: "nvidia/llama-nemotron-embed-1b-v2"
  embeddingdimensions: 2048
  embeddinghost: ""
  embeddingport: "8000"
  embeddinghttpscheme: "http"
