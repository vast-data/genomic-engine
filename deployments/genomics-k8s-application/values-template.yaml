global:
  imageTag: latest

backend:
  image: vastdatasolutions/genomic-engine-backend
  replicas: 1
  port: 8000
  serviceType: NodePort
  # Optional fixed NodePort (30000-32767). Leave empty/0 to let Kubernetes auto-assign.
  # Set this to a stable value to make the external port survive redeploys.
  nodePort: 0

frontend:
  image: vastdatasolutions/genomic-engine-frontend
  replicas: 1
  serviceType: NodePort
  # Optional fixed NodePort (30000-32767). Leave empty/0 to let Kubernetes auto-assign.
  nodePort: 0

mock:
  parabricks:
    image: vastdatasolutions/genomic-engine-mock-parabricks

vast:
  access_key: ""
  secret_key: ""

auth:
  vms_host: ""
  tenant_name: "default"
  # jwt_secret MUST be set to a long random string (e.g. `openssl rand -hex 32`).
  # The backend refuses to start if this is empty. Same value should be reused on
  # rolling upgrades, otherwise all existing user sessions are invalidated.
  jwt_secret: ""

s3:
  endpoint: "http://"
  raw_bucket: "genomics-raw-data"
  fastq_bucket: "genomics-fastq-files"
  vcf_bucket: "genomics-vcf-outputs"

vdb:
  endpoint: "http://"
  bucket: "genomics-data"
  schema_name: "genomics"

nvidia:
  use_api_catalog: false
  api_key: ""

# BioNeMo service endpoints.
# Defaults point to NVIDIA cloud (API catalog).
# Override with local NIM service URLs when nim.enabled: true.
bionemo:
  molmim_url: "https://health.api.nvidia.com/v1/biology/nvidia/molmim/generate"
  diffdock_url: "https://health.api.nvidia.com/v1/biology/mit/diffdock"

embedding:
  host: ""
  port: "443"
  model: "nvidia/llama-3.2-nv-embedqa-1b-v2"
  dimensions: 2048

llm:
  host: ""
  port: "443"
  # NVIDIA cloud API model (when nvidia.use_api_catalog: true).
  # Empirically nvidia/llama-3.1-nemotron-nano-8b-v1 is ~7x faster than meta/llama-3.1-8b-instruct
  # on the free tier (~4s vs ~26s for 300-token outputs) with comparable quality.
  # When nim.enabled: true, the in-cluster NIM container below dictates the model regardless.
  model: "nvidia/llama-3.1-nemotron-nano-8b-v1"
  system_prompt: "You are a clinical genomics assistant. Given patient variant data retrieved from a genomic database, provide clear, evidence-based answers to clinical questions. Always note when findings require clinical validation. Cite specific variants and genes in your response."

job:
  gpu:
    image: nvcr.io/nvidia/clara/clara-parabricks:4.7.0-1
    timeout_seconds: 3600
    resources:
      requests:
        cpu: "2"
        memory: "32Gi"
        nvidia.com/gpu: "1"
      limits:
        memory: "32Gi"
        nvidia.com/gpu: "1"
    nodeSelector:
      nvidia.com/gpu: "true"
    tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
  mock:
    image: vastdatasolutions/genomic-engine-mock-parabricks:dev
    timeout_seconds: 600
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        memory: "1Gi"
    nodeSelector: {}
    tolerations: []

processing_mode: "mock"

# ---------------------------------------------------------------------------
# Local NIM deployment (optional -- requires GPU nodes with NVIDIA drivers)
# ---------------------------------------------------------------------------
# Set nim.enabled: true to deploy all NVIDIA NIM containers in-cluster.
# When enabled, also set:
#   nvidia.use_api_catalog: false
#   embedding.host: nim-embed
#   embedding.port: "8000"
#   llm.host: nim-llm
#   llm.port: "8000"
#   bionemo.molmim_url: "http://nim-molmim:8000/v1/biology/nvidia/molmim/generate"
#   bionemo.diffdock_url: "http://nim-diffdock:8000/v1/biology/mit/diffdock"
# ---------------------------------------------------------------------------
nim:
  enabled: false
  ngc_api_key: ""          # NGC API key -- used for image pull and model download
  cache_path: /mnt/nim-cache  # hostPath on GPU nodes for model weight cache

  gpu_toleration:
    key: "sku"
    operator: "Equal"
    value: "gpu"
    effect: "NoSchedule"

  llm:
    image: nvcr.io/nim/meta/llama-3.1-8b-instruct:latest
    gpu: 1
    memory: 24Gi

  embedding:
    image: nvcr.io/nim/nvidia/llama-3.2-nv-embedqa-1b-v2:latest
    gpu: 1
    memory: 8Gi

  molmim:
    image: nvcr.io/nim/nvidia/molmim:latest
    gpu: 1
    memory: 16Gi

  diffdock:
    image: nvcr.io/nim/mit/diffdock:latest
    gpu: 1
    memory: 24Gi
