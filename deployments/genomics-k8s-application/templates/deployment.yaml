apiVersion: v1
kind: Secret
metadata:
  name: genomic-secrets
type: Opaque
stringData:
  s3_endpoint: {{ .Values.s3.endpoint | quote }}
  s3_access_key: {{ .Values.vast.access_key | quote }}
  s3_secret_key: {{ .Values.vast.secret_key | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: genomic-engine-config
type: Opaque
stringData:
  config.yaml: |
    vast:
      access_key: {{ .Values.vast.access_key | quote }}
      secret_key: {{ .Values.vast.secret_key | quote }}
    auth:
      vms_host: {{ .Values.auth.vms_host | quote }}
      tenant_name: {{ .Values.auth.tenant_name | quote }}
      jwt_secret: {{ .Values.auth.jwt_secret | quote }}
    s3:
      endpoint: {{ .Values.s3.endpoint | quote }}
      raw_bucket: {{ .Values.s3.raw_bucket | quote }}
      fastq_bucket: {{ .Values.s3.fastq_bucket | quote }}
      vcf_bucket: {{ .Values.s3.vcf_bucket | quote }}
    vdb:
      endpoint: {{ .Values.vdb.endpoint | quote }}
      bucket: {{ .Values.vdb.bucket | quote }}
      schema_name: {{ .Values.vdb.schema_name | quote }}
    nvidia:
      use_api_catalog: {{ .Values.nvidia.use_api_catalog }}
      api_key: {{ .Values.nvidia.api_key | quote }}
    bionemo:
      molmim_url: {{ .Values.bionemo.molmim_url | quote }}
      diffdock_url: {{ .Values.bionemo.diffdock_url | quote }}
    embedding:
      host: {{ .Values.embedding.host | quote }}
      port: {{ .Values.embedding.port | quote }}
      model: {{ .Values.embedding.model | quote }}
      dimensions: {{ .Values.embedding.dimensions }}
    llm:
      host: {{ .Values.llm.host | quote }}
      port: {{ .Values.llm.port | quote }}
      model: {{ .Values.llm.model | quote }}
      system_prompt: {{ .Values.llm.system_prompt | quote }}
    job:
{{ toYaml .Values.job | indent 6 }}
    processing_mode: {{ .Values.processing_mode | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        checksum/config: {{ toYaml .Values | sha256sum }}
    spec:
      serviceAccountName: backend-sa
      containers:
        - name: backend
          image: {{ .Values.backend.image }}:{{ .Values.global.imageTag }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.backend.port }}
          volumeMounts:
            - name: config
              mountPath: /etc/secrets
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: genomic-engine-config
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: {{ .Values.backend.serviceType | default "ClusterIP" }}
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: {{ .Values.backend.port }}
      {{- if and (eq (.Values.backend.serviceType | default "ClusterIP") "NodePort") (and .Values.backend.nodePort (ne (int .Values.backend.nodePort) 0)) }}
      nodePort: {{ .Values.backend.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: {{ .Values.frontend.image }}:{{ .Values.global.imageTag }}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: {{ .Values.frontend.serviceType | default "ClusterIP" }}
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      {{- if and (eq (.Values.frontend.serviceType | default "ClusterIP") "NodePort") (and .Values.frontend.nodePort (ne (int .Values.frontend.nodePort) 0)) }}
      nodePort: {{ .Values.frontend.nodePort }}
      {{- end }}
